version: '3.8'

services:
  db:
    image: postgres:16
    container_name: etl_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-etl_db}
      POSTGRES_USER: ${DB_USER:-etl_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-etl_password}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
